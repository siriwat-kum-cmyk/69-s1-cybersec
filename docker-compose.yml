services:
  db:
    image: postgres:16-alpine
    container_name: 69-s1-db
    ports:
      - 54327:5432
    environment:
      - POSTGRES_PASSWORD=iop123789
      - POSTGRES_USER=Siriwat 
      - POSTGRES_DB=Siriwat
    volumes:
      - ./data:/var/lib/postgresql/data

  admin:
    image: dpage/pgadmin4
    container_name: 69-s1-admin
    ports:
      - 8081:80
    environment:
      - PGADMIN_DEFAULT_EMAIL=siriwat-kum@rmutp.ac.th
      - PGADMIN_DEFAULT_PASSWORD=zxc123789
    volumes:
      - ./pgadmin:/var/lib/pgadmin
