version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: 69-s1-db
    ports:
      - "${DB_PORT}:5432"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - ./data:/var/lib/postgresql/data

  admin:
    image: dpage/pgadmin4
    container_name: 69-s1-admin
    ports:
      - "${PG_PORT}:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PG_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PG_PASS}
    volumes:
      - ./pgadmin:/var/lib/pgadmin
    depends_on:
      - db

  app:
    image: prawee/strapi
    container_name: 69-s1-app
    ports:
      - "${APP_PORT}:1337"
    environment:
      - DATABASE_CLIENT=postgres
      - DATABASE_HOST=172.26.64.1
      - DATABASE_PORT=${DB_PORT}
      - DATABASE_NAME=${DB_NAME}
      - DATABASE_USERNAME=${DB_USER}
      - DATABASE_PASSWORD=${DB_PASS}
      - DATABASE_SSL=false
      - JWT_SECRET=${APP_JWT_SECRET}
      - ADMIN_JWT_SECRET=${APP_ADMIN_JWT_SECRET}
      - APP_KEYS=${APP_KEYS}
      - API_TOKEN_SALT=${APP_API_TOKEN_SALT}
      - TRANSFER_TOKEN_SALT=${APP_TRANSFER_TOKEN_SALT}
    depends_on:
      - db
